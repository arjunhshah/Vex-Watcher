name: VexWatcher
options:
  bundleIdPrefix: com.vexwatcher
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  VexWatcher:
    type: application
    platform: iOS
    sources:
      - path: VexWatcher/iOS
        excludes:
          - Info.plist
      - path: VexWatcher/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vexwatcher.app
        PRODUCT_NAME: VexWatcher
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VexWatcher/iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vex Watcher
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: VexWatcherWatch
        embed: true
        codeSign: true
    scheme: {}
  VexWatcherWatch:
    type: application
    platform: watchOS
    sources:
      - path: VexWatcher/Watch
        excludes:
          - Info.plist
      - path: VexWatcher/Shared
        excludes:
          - API.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vexwatcher.app.watch
        PRODUCT_NAME: VexWatcherWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: VexWatcher/Watch/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Vex Watcher
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.vexwatcher.app
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  VexWatcher:
    build:
      targets:
        VexWatcher: all
        VexWatcherWatch: all
    run:
      config: Debug
